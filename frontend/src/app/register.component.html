<main class="auth-page">
  <section class="auth-panel">
    <div class="auth-header">
      <a class="brand auth-brand" routerLink="/" aria-label="JILA home">
        <span class="brand-mark">J</span>
        <span>JILA</span>
      </a>
      <h1>Create your account</h1>
      <p class="auth-subtitle">Join your team on a focused, modern issue tracker</p>
    </div>

    <!-- Google Sign In Button (hidden if not configured) -->
    <ng-container *ngIf="googleEnabled">
      <button
        type="button"
        class="btn-google"
        (click)="continueWithGoogle()"
        [disabled]="submitting"
      >
        <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
          />
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider">
        <span>or register with email</span>
      </div>
    </ng-container>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="register-name">Display name</label>
        <input
          id="register-name"
          type="text"
          autocomplete="name"
          maxlength="100"
          formControlName="displayName"
          [attr.aria-invalid]="
            form.controls.displayName.invalid && form.controls.displayName.touched
          "
          aria-describedby="register-name-error"
        />
        <span
          *ngIf="form.controls.displayName.invalid && form.controls.displayName.touched"
          id="register-name-error"
          class="field-error"
          >Display name is required and must be 100 characters or fewer.</span
        >
      </div>

      <div class="field">
        <label for="register-email">Email</label>
        <input
          id="register-email"
          type="email"
          autocomplete="email"
          maxlength="254"
          formControlName="email"
          [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
          aria-describedby="register-email-error"
        />
        <span
          *ngIf="form.controls.email.invalid && form.controls.email.touched"
          id="register-email-error"
          class="field-error"
          >Enter a valid email address.</span
        >
      </div>

      <div class="field">
        <label for="register-password">Password</label>
        <div class="password-input">
          <input
            id="register-password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="password"
            [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
            aria-describedby="register-password-error"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <span
          *ngIf="form.controls.password.invalid && form.controls.password.touched"
          id="register-password-error"
          class="field-error"
          >Use 12 to 72 characters.</span
        >
      </div>

      <div class="field">
        <label for="register-confirm">Confirm password</label>
        <div class="password-input">
          <input
            id="register-confirm"
            [type]="showConfirmPassword ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="confirmPassword"
            [attr.aria-invalid]="
              (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch')) &&
              form.controls.confirmPassword.touched
            "
            aria-describedby="register-confirm-error"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="showConfirmPassword = !showConfirmPassword"
            [attr.aria-label]="
              showConfirmPassword ? 'Hide password confirmation' : 'Show password confirmation'
            "
          >
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <span
          *ngIf="
            form.controls.confirmPassword.touched &&
            (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch'))
          "
          id="register-confirm-error"
          class="field-error"
          >Passwords must match.</span
        >
      </div>

      <p *ngIf="errorMessage" class="form-error" role="alert">{{ errorMessage }}</p>

      <button class="submit-button btn-primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </section>
</main>
